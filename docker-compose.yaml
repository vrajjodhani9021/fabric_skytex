services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skytex
      POSTGRES_PASSWORD: skytexpass
      POSTGRES_DB: fabrics
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://skytex:skytexpass@db:5432/fabrics"
      SECRET_KEY: "change-this-secret"
      FLASK_ENV: "production"
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    command: sh -c "python backend/migrate_admin.py && exec gunicorn -w 2 -b 0.0.0.0:5000 backend.app:app"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro

  frontend:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  db-data:
    name: skytex_db_data
